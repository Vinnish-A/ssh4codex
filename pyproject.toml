[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh4codex"
version = "0.4.0"
description = "Task-oriented SSH and tmux execution for coding agents"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
test = ["pytest>=8"]

[project.scripts]
ssh4codex = "ssh4codex.cli:main"
ssh4codex-mcp = "ssh4codex.mcp_server:main"

[tool.setuptools.package-data]
ssh4codex = ["remote.py"]

[tool.setuptools.packages.find]
include = ["ssh4codex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
